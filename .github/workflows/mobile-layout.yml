name: Mobile layout check

# Builds the site and loads every page at phone widths (360px Android,
# iPhone SE, iPhone 15). Fails if text or images spill past the screen.
# Screenshots of every page are in the "mobile-layout-report" artifact.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mobile-layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install browsers (Chrome engine + Safari engine)
        run: npx playwright install --with-deps chromium webkit

      - name: Check layout on phones
        run: npm run test:mobile

      - name: Upload report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mobile-layout-report
          path: playwright-report/
          retention-days: 14
